# Repository checks; version 4
# Operation: 9958955d-d025-463b-b7e4-b1eba32eb55a
name: Check runner environment
run-name: Check runner environment
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: repo-maintenance-9958955d-d025-463b-b7e4-b1eba32eb55a
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check runner environment
        run: >
          set -euo pipefail

          { uname -s; git --version; node --version; df -Pk / | tail -1; test -d
          "$RUNNER_TEMP"; printf "Environment check passed\n"; } | tee
          "$RUNNER_TEMP/repo-maintenance-check.txt"
      - name: Save environment details
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-environment
          path: ${{ runner.temp }}/repo-maintenance-check.txt
          retention-days: 1
          if-no-files-found: error
